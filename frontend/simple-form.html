<!DOCTYPE html>
<html>
<head>
    <title>Direct API Post Test</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #333; }
        label { display: block; margin: 10px 0 5px; }
        input[type=text], input[type=file] { margin-bottom: 15px; width: 100%; padding: 8px; }
        input[type=submit] { background: #4285f4; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        input[type=submit]:hover { background: #3367d6; }
        .result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Direct API Post Test</h1>
        <p>This page will post directly to the /generate endpoint at localhost:8080</p>
        
        <div id="form-container">
            <form id="test-form">
                <label for="file">Select Image File:</label>
                <input type="file" id="file" name="file" required>
                
                <label for="prompt">Style Prompt:</label>
                <input type="text" id="prompt" name="prompt" value="studio ghibli" required>
                
                <input type="submit" value="Send to API">
            </form>
        </div>
        
        <div id="result" class="result" style="display:none;"></div>
    </div>
    
    <script>
        // Super simple script to post to the API
        document.getElementById('test-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Sending request...';
            
            try {
                // Get the file and prompt
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];
                const prompt = document.getElementById('prompt').value;
                
                // Create a simple FormData object
                const formData = new FormData();
                formData.append('file', file);
                formData.append('prompt', prompt);
                
                // Make a simple fetch call
                const response = await fetch('http://localhost:8080/generate/', {
                    method: 'POST',
                    body: formData
                });
                
                // Check if the response was successful
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}: ${response.statusText}`);
                }
                
                // Get the response as a blob and create a URL for it
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                // Display the image
                resultDiv.innerHTML = `
                    <p>Success! Received ${blob.size} bytes.</p>
                    <img src="${imageUrl}" alt="Generated image" style="max-width:100%;">
                `;
            } catch (error) {
                // Display any errors
                resultDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
